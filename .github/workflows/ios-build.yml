name: iOS build check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          xcodebuild -version
          xcodebuild -list -project Antikspanaren.xcodeproj

      - name: Generate app icon
        run: swift scripts/generate_app_icon.swift

      - name: Build iOS Simulator target
        run: |
          xcodebuild \
            -project Antikspanaren.xcodeproj \
            -scheme Antikspanaren \
            -sdk iphonesimulator \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Build unsigned iOS device app
        run: |
          xcodebuild \
            -project Antikspanaren.xcodeproj \
            -scheme Antikspanaren \
            -sdk iphoneos \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package unsigned IPA
        run: |
          mkdir -p ipa/Payload
          cp -R build/Build/Products/Release-iphoneos/Antikspanaren.app ipa/Payload/
          cd ipa
          zip -r ../Antikspanaren-unsigned.ipa Payload

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: Antikspanaren-unsigned-IPA
          path: Antikspanaren-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
